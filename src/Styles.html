<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Company colors, as on agility-kitchen.pages.dev: navy blue and pink. */
  :root {
    --navy: #1e4d9f;
    --navy-dark: #163a78;
    --pink: #e4317a;
    --pink-soft: #fde8f1;
    --bg: #ffffff;
    --surface: #f6f8fc;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --font: 'Poppins', 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  .test-banner {
    background: #fef3c7;
    color: #78350f;
    border-bottom: 1px solid #fcd34d;
    font-size: 13px;
    padding: 6px 16px;
    text-align: center;
  }
  .banner {
    padding: 28px 16px 8px;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
  }
  .banner h1 { margin: 0; font-size: 28px; letter-spacing: 1px; color: var(--navy); }
  .banner h1::after {
    content: ''; display: block; width: 44px; height: 4px; border-radius: 2px;
    background: var(--pink); margin-top: 6px;
  }
  .range { margin: 8px 0 0; font-size: 18px; font-weight: 600; color: var(--navy); }
  main { max-width: 1240px; width: 100%; margin: 0 auto; padding: 16px 16px 48px; flex: 1; }
  .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 12px 16px; border-radius: 8px; }

  /* Cards in a row stretch to the same height, so the vote row and date line up. */
  .week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
  @media (max-width: 980px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .week { grid-template-columns: 1fr; } }

  .day { display: flex; flex-direction: column; height: 100%; transition: opacity .2s; }
  .day.faded { opacity: .45; }
  .card {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(30, 77, 159, .08);
    padding: 18px 16px 16px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .day.today .card { border: 2px solid var(--pink); box-shadow: 0 4px 16px rgba(228, 49, 122, .18); }

  .img-slot {
    width: 128px; height: 128px; border-radius: 50%;
    overflow: hidden; flex: none;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: 11px; padding: 12px;
    border: 2px dashed #cbd5e1;
  }
  .img-slot img { width: 100%; height: 100%; object-fit: cover; }
  .img-slot.has-img { padding: 0; border: none; }

  .weekday-number { font-size: 34px; font-weight: 700; line-height: 1; margin: 12px 0 2px; color: var(--navy); }
  .weekday-name { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 10px; }
  .dishes { list-style: none; margin: 0; padding: 0; text-align: center; font-size: 14px; line-height: 1.5; }
  .dishes .main { font-weight: 700; color: var(--navy); }
  .notice { color: var(--muted); font-style: italic; font-size: 14px; text-align: center; }
  .holiday-name { font-weight: 700; text-align: center; font-size: 15px; color: var(--pink); }

  .votes { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 4px; }
  .vote-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; color: #9ca3af; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; padding: 4px; border-radius: 6px;
  }
  .vote-btn svg { width: 26px; height: 26px; }
  .vote-btn:disabled { cursor: default; opacity: .4; }
  .vote-btn.like:not(:disabled):hover { color: var(--pink); background: var(--pink-soft); }
  .vote-btn.dislike:not(:disabled):hover { color: var(--navy); background: var(--surface); }
  .vote-btn:focus-visible { outline: 2px solid var(--pink); }
  .vote-btn.like.active { color: var(--pink); }
  .vote-btn.like.active svg .fill { fill: currentColor; }
  .vote-btn.dislike.active { color: var(--navy); }
  .vote-btn.dislike.active svg .ring { fill: currentColor; }
  .vote-btn.dislike.active svg .mark { stroke: #fff; }
  .date { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .6px; color: var(--navy); text-transform: uppercase; margin-top: 6px; }
  .day.today .date { color: var(--pink); }

  .counts { margin-top: 36px; }
  .counts h2 { font-size: 16px; margin: 0 0 10px; color: var(--navy); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: var(--navy); color: #fff; font-weight: 600; }
  tr.total td { font-weight: 700; color: var(--navy); background: var(--surface); border-bottom: none; }

  .footer {
    background: var(--navy);
    color: #fff;
    font-size: 13px;
    padding: 14px 16px;
    text-align: center;
  }
  .footer .heart { color: var(--pink); }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--navy-dark); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px);
  }
</style>
