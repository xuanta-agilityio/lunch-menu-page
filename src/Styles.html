<style>
  :root {
    --bg: #1e2732;
    --bg-deep: #151c24;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #6b7785;
    --accent: #3b82f6;
    --accent-soft: #93c5fd;
    --heart: #e11d48;
    --line: #2c3845;
    --font: 'Poppins', 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: #e5e9ee;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .test-banner {
    background: #f59e0b;
    color: #111;
    font-size: 13px;
    padding: 6px 16px;
    text-align: center;
  }
  .banner {
    background: radial-gradient(circle at 85% 40%, #7a2e1d 0, transparent 30%),
                radial-gradient(circle at 12% 30%, #2f5d2a 0, transparent 25%),
                linear-gradient(120deg, #2a3440, #1b232c);
    padding: 28px 24px 22px;
    border-bottom: 1px solid var(--line);
  }
  .banner h1 { margin: 0; font-size: 26px; letter-spacing: 1px; color: #fff; }
  .range { margin: 2px 0 0; font-size: 20px; font-weight: 600; color: #fff; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  .error { background: #7f1d1d; color: #fff; padding: 12px 16px; border-radius: 8px; }

  .week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; }
  @media (max-width: 980px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .week { grid-template-columns: 1fr; } }

  .day { display: flex; flex-direction: column; transition: opacity .2s; }
  .day.faded { opacity: .45; }
  .card {
    background: var(--card);
    color: var(--ink);
    border-radius: 10px;
    padding: 18px 16px 16px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px solid transparent;
  }
  .day.today .card { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59,130,246,.25); }

  .img-slot {
    width: 128px; height: 128px; border-radius: 50%;
    overflow: hidden; flex: none;
    background: #eef1f4;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: 11px; padding: 12px;
    border: 2px dashed #cfd6de;
  }
  .img-slot img { width: 100%; height: 100%; object-fit: cover; }
  .img-slot.has-img { padding: 0; border: none; }

  .weekday-number { font-size: 34px; font-weight: 700; line-height: 1; margin: 12px 0 2px; }
  .weekday-name { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 10px; }
  .dishes { list-style: none; margin: 0; padding: 0; text-align: center; font-size: 14px; line-height: 1.5; }
  .dishes .main { font-weight: 700; }
  .notice { color: var(--muted); font-style: italic; font-size: 14px; text-align: center; }
  .holiday-name { font-weight: 700; text-align: center; font-size: 15px; }

  .votes { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 4px; }
  .vote-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; color: #c7cfd8; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; padding: 4px; border-radius: 6px;
  }
  .vote-btn svg { width: 26px; height: 26px; }
  .vote-btn:disabled { cursor: default; opacity: .4; }
  .vote-btn:not(:disabled):hover { background: rgba(255,255,255,.06); }
  .vote-btn:focus-visible { outline: 2px solid var(--accent-soft); }
  .vote-btn.like.active { color: var(--heart); }
  .vote-btn.dislike.active { color: var(--accent-soft); }
  .vote-btn.active svg .fill { fill: currentColor; }
  .date { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .6px; color: var(--accent); text-transform: uppercase; margin-top: 6px; }
  .day.today .date { color: var(--accent-soft); }

  .counts { margin-top: 36px; }
  .counts h2 { font-size: 16px; margin: 0 0 10px; color: #fff; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--accent-soft); font-weight: 600; }
  tr.total td { font-weight: 700; color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); max-width: calc(100% - 32px);
  }
</style>
